<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04121f">
  <title>深海大亂潛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'system-ui', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'serif'],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#04121f] font-sans text-cyan-50 antialiased">
<div id="app" class="relative mx-auto h-[100dvh] w-full max-w-md overflow-hidden">
  <!-- 水中光線與氣泡（純裝飾） -->
  <div class="ocean-bg absolute inset-0" aria-hidden="true"></div>
  <div id="bubbles" class="bubbles absolute inset-0" aria-hidden="true"></div>

  <!-- ==================== 首頁 ==================== -->
  <section id="screen-home" class="screen relative flex h-full flex-col items-center justify-center gap-6 px-6">
    <div class="text-center">
      <div class="title-diver mx-auto mb-3 text-6xl">🤿</div>
      <h1 class="glow-title font-serif text-4xl font-black tracking-widest">深海大亂潛</h1>
      <p class="mt-2 text-sm text-cyan-100/80">多人連線｜機關在潛伴手上，大聲喊出來！</p>
    </div>

    <div class="glass-card w-full space-y-4 p-5">
      <label class="block">
        <span class="mb-1 block text-sm font-bold text-cyan-100">你的潛水暱稱</span>
        <input id="input-name" maxlength="12" placeholder="例如：會吐口水的面鏡"
               class="w-full rounded-xl border-2 border-cyan-700 bg-black/30 px-4 py-3 text-lg text-cyan-50 placeholder-cyan-100/40 outline-none focus:border-cyan-300">
      </label>

      <button id="btn-create" class="btn-primary w-full">🚤 開一艘潛水船</button>

      <div class="flex items-center gap-2 text-xs text-cyan-100/60">
        <div class="h-px flex-1 bg-cyan-100/30"></div>或輸入船號上船<div class="h-px flex-1 bg-cyan-100/30"></div>
      </div>

      <div class="flex gap-2">
        <input id="input-code" maxlength="4" placeholder="ABCD" autocapitalize="characters"
               class="w-0 flex-1 rounded-xl border-2 border-cyan-700 bg-black/30 px-4 py-3 text-center font-mono text-2xl uppercase tracking-[0.4em] text-cyan-50 placeholder-cyan-100/30 outline-none focus:border-cyan-300">
        <button id="btn-join" class="btn-secondary">上船</button>
      </div>
    </div>

    <button id="btn-solo" class="solo-entry w-full">🎧 單人練習<small>AI 潛伴用語音喊你</small></button>
  </section>

  <!-- ==================== 單人練習設定 ==================== -->
  <section id="screen-solo" class="screen relative hidden h-full flex-col gap-3 overflow-y-auto px-5 py-5">
    <div class="text-center">
      <h1 class="glow-title font-serif text-3xl font-black">🎧 單人練習</h1>
      <p class="mt-1 text-sm text-cyan-100/80">AI 潛伴會「用說的」喊指令，戴耳機或開聲音玩</p>
    </div>
    <div class="glass-card p-3">
      <h2 class="mb-2 font-serif text-lg font-black">難度</h2>
      <div id="solo-diff" class="grid grid-cols-3 gap-2" role="radiogroup" aria-label="難度">
        <button type="button" class="diff" data-level="easy" role="radio"><b>🐠</b><span>體驗潛水</span><small>一次一條</small></button>
        <button type="button" class="diff" data-level="medium" role="radio"><b>🐬</b><span>進階潛水員</span><small>兩人同時喊</small></button>
        <button type="button" class="diff" data-level="hard" role="radio"><b>🦈</b><span>技術潛水</span><small>亂喊＋只聽聲音＋事故</small></button>
      </div>
    </div>
    <div class="glass-card p-3">
      <h2 class="mb-2 font-serif text-lg font-black">玩法</h2>
      <div id="solo-mode" class="grid grid-cols-2 gap-2" role="radiogroup" aria-label="玩法">
        <button type="button" class="diff" data-mode="timed" role="radio"><b>⏱️</b><span>計時 3 分鐘</span><small>撐到下班</small></button>
        <button type="button" class="diff" data-mode="endless" role="radio"><b>♾️</b><span>無盡下潛</span><small>越來越快，撐到沒氣</small></button>
      </div>
    </div>
    <div class="glass-card space-y-2 p-3">
      <label class="toggle-row"><span>🔊 AI 潛伴語音</span><input id="solo-voice" type="checkbox" checked></label>
      <label class="toggle-row"><span>🎵 背景音樂</span><input id="solo-music" type="checkbox" checked></label>
      <label id="solo-mic-row" class="toggle-row hidden"><span>🎤 我也要喊<small>偶爾要你對手機喊指令給潛伴（需要麥克風）</small></span><input id="solo-mic" type="checkbox"></label>
    </div>
    <div class="glass-card p-3">
      <h2 class="mb-1 font-serif text-lg font-black">🏆 我的最高分</h2>
      <div id="solo-best" class="grid grid-cols-3 gap-2 text-center text-xs"></div>
    </div>
    <button id="btn-solo-start" class="btn-primary w-full">🌊 開始下潛</button>
    <button id="btn-solo-back" class="text-sm text-cyan-100/60 underline">回首頁</button>
  </section>

  <!-- ==================== 大廳 ==================== -->
  <section id="screen-lobby" class="screen relative hidden h-full flex-col gap-3 px-5 py-5">
    <div class="glass-card p-4 text-center">
      <p class="text-sm text-cyan-100/80">潛水船船號</p>
      <p id="lobby-code" class="font-mono text-5xl font-black tracking-[0.3em] text-amber-300 drop-shadow-[0_0_12px_rgba(251,191,36,.6)]">----</p>
      <button id="btn-share" class="mt-2 rounded-full bg-cyan-900/60 px-4 py-1.5 text-sm text-cyan-50 active:scale-95">🔗 複製上船連結</button>
    </div>

    <!-- 難度（船長選） -->
    <div class="glass-card p-3">
      <div class="mb-2 flex items-baseline justify-between">
        <h2 class="font-serif text-lg font-black">潛水難度</h2>
        <span id="diff-note" class="text-xs text-cyan-100/70"></span>
      </div>
      <div id="diff-picker" class="diff-picker grid grid-cols-3 gap-2" role="radiogroup" aria-label="潛水難度">
        <button type="button" class="diff" data-level="easy" role="radio"><b>🐠</b><span>體驗潛水</span><small>低｜聽名字就好</small></button>
        <button type="button" class="diff" data-level="medium" role="radio"><b>🐬</b><span>進階潛水員</span><small>中｜三段開關＋方向</small></button>
        <button type="button" class="diff" data-level="hard" role="radio"><b>🦈</b><span>技術潛水</span><small>高｜數字＋潛水事故</small></button>
      </div>
    </div>

    <div class="glass-card flex min-h-0 flex-1 flex-col p-4">
      <div class="mb-2 flex items-baseline justify-between">
        <h2 class="font-serif text-xl font-black">潛水小隊</h2>
        <span id="lobby-count" class="text-sm text-cyan-100/80">0 / 10</span>
      </div>
      <ul id="lobby-players" class="min-h-0 flex-1 space-y-2 overflow-y-auto"></ul>
    </div>

    <p id="lobby-hint" class="text-center text-sm text-cyan-100/80"></p>
    <button id="btn-start" class="btn-primary w-full" disabled>🌊 開始下潛</button>
    <button id="btn-leave" class="text-sm text-cyan-100/60 underline">下船</button>
  </section>

  <!-- ==================== 遊戲畫面 ==================== -->
  <section id="screen-game" class="screen relative hidden h-full flex-col">
    <!-- 頂部狀態區（10%）：氣瓶壓力錶 + 潛水時間 -->
    <header class="status-bar relative flex h-[10%] min-h-[56px] items-center gap-3 px-3">
      <div class="flex-1">
        <div class="mb-1 flex items-center justify-between text-xs font-bold">
          <span id="air-label">🫧 氣瓶壓力</span>
          <span id="stability-text" class="font-mono text-sm">100 bar</span>
        </div>
        <div class="stability-track h-4 w-full overflow-hidden rounded-full">
          <div id="stability-fill" class="stability-fill h-full rounded-full"></div>
        </div>
      </div>
      <div class="timer-box flex flex-col items-center justify-center rounded-xl px-3 py-1">
        <button id="btn-music" class="music-btn" type="button" aria-label="背景音樂開關">🎵</button>
        <span id="timer-label" class="text-[10px] text-cyan-100/70">剩餘潛水時間</span>
        <span id="game-timer" class="font-mono text-xl font-black">3:00</span>
      </div>
    </header>

    <!-- 指令區（30%）：水下寫字板 + 聲納 -->
    <section id="instruction-zone" class="slate relative flex h-[30%] flex-col items-center justify-center overflow-hidden px-5">
      <div class="sonar" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="relative z-10 mb-1 text-xs font-bold tracking-widest text-sky-900/80">📣 大聲喊給潛伴聽！</p>
      <span id="level-chip" class="level-chip"></span>
      <div id="solo-orders" class="solo-orders hidden"></div>
      <p id="instruction-text" class="instruction-text relative z-10 text-center font-serif font-black leading-snug text-[#0b2a3d]">
        準備下水……
      </p>
      <div class="absolute bottom-3 left-4 right-4 z-10 h-3 overflow-hidden rounded-full bg-[#0b2a3d]/20 ring-1 ring-[#0b2a3d]/40">
        <div id="instr-bar" class="instr-bar h-full w-0 rounded-full"></div>
      </div>
      <span id="instr-seconds" class="absolute bottom-6 right-5 z-10 font-mono text-xs font-bold text-[#0b2a3d]/70"></span>
    </section>

    <!-- 操作區（60%）：潛水裝備面板 -->
    <main id="panel" class="gear-panel grid h-[60%] grid-cols-2 grid-rows-2 gap-3 p-3"></main>

    <!-- 開局倒數 -->
    <div id="countdown" class="countdown hidden" aria-live="assertive"><span id="countdown-num">3</span></div>
  </section>

  <!-- ==================== 結算 ==================== -->
  <section id="screen-result" class="screen relative hidden h-full flex-col gap-3 px-5 py-5">
    <div class="glass-card p-4 text-center">
      <p id="result-reason" class="text-sm text-cyan-100/80"></p>
      <p id="result-rank" class="glow-title mt-1 font-serif text-2xl font-black"></p>
      <div class="mt-3 grid grid-cols-3 gap-2 text-center">
        <div class="stat-cell"><span id="result-completed" class="text-2xl font-black text-emerald-300">0</span><small>完成指令</small></div>
        <div class="stat-cell"><span id="result-failed" class="text-2xl font-black text-amber-300">0</span><small>逾時</small></div>
        <div class="stat-cell"><span id="result-wrong" class="text-2xl font-black text-rose-300">0</span><small>亂按</small></div>
      </div>
      <p class="mt-3 text-sm">剩餘氣量 <b id="result-stability">0 bar</b>｜潛了 <b id="result-time">0:00</b></p>
    </div>
    <div class="glass-card flex min-h-0 flex-1 flex-col p-4">
      <h2 class="mb-2 font-serif text-xl font-black">🏅 潛伴頒獎典禮</h2>
      <ol id="result-players" class="min-h-0 flex-1 space-y-2 overflow-y-auto"></ol>
    </div>
    <button id="btn-again" class="btn-primary w-full">🔁 回船上再潛一次</button>
    <p id="result-wait" class="hidden text-center text-sm text-cyan-100/80">等待船長回到大廳……</p>
    <button id="btn-result-home" class="hidden text-sm text-cyan-100/60 underline">回首頁</button>
  </section>

  <!-- 全螢幕特效層 -->
  <div id="fx-green" class="fx-overlay fx-green" aria-hidden="true"></div>
  <div id="fx-red" class="fx-overlay fx-red" aria-hidden="true"></div>

  <!-- 提示訊息 -->
  <div id="toast" class="toast pointer-events-none absolute left-1/2 z-50 -translate-x-1/2 rounded-full bg-black/80 px-4 py-2 text-sm text-cyan-50 opacity-0 shadow-lg"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/music.js"></script>
<script src="js/scenes.js"></script>
<script src="js/client.js"></script>
</body>
</html>
